// Population gRPC service — docs/POPULATION_TZ.md §5.2, §8.10.
// One bidi stream: Open → (Tick → Orders → Advance)* → End | Close.
syntax = "proto3";

package cmf.population.v1;

option cc_enable_arenas = true;

import "messages.proto";

service PopulationVenue {
  rpc Run(stream ClientMessage) returns (stream ServerMessage);
}
