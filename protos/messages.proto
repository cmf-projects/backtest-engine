// Population wire messages — docs/POPULATION_TZ.md §§5.2–5.4, 8.3, 8.7.
syntax = "proto3";

package cmf.population.v1;

option cc_enable_arenas = true;

// ---------------------------------------------------------------------------
// Control
// ---------------------------------------------------------------------------

// Semantic class of a component (many futures/options allowed).
// Not a unique key — see component_id. UNSPECIFIED on Component → Error.
enum AssetRole {
  ASSET_ROLE_UNSPECIFIED = 0;
  ASSET_ROLE_SPOT = 1;
  ASSET_ROLE_FUTURE = 2;
  ASSET_ROLE_OPTION = 3;
}

// One leg of the bundle: its own JSONL + instrument + tick grid.
// Many Components may share the same role (e.g. several expiries).
message Component {
  // Unique within Open. Wire key for books / overlays / orders / trades.
  // Example: "FUT_202606", "OPT_C_1.20_202606".
  string component_id = 1;
  // spot / future / option — classification only, not uniqueness.
  AssetRole role = 2;
  // Path to this component's snapshot JSONL.
  string dataset_path = 3;
  // Short product/venue class (CMF ≤ 7 chars). Example: "FCEU".
  string class_code = 4;
  // Full instrument id; must match JSONL `symbol`.
  // Example: "FCEU SI 20260615 PS".
  string sec_code = 5;
  // Price tick grid as decimal text (e.g. "0.0001"). Off-grid → reject.
  string tick_size = 6;
}

// First client message: opens and freezes the population for this stream.
// Run always starts at the first dataset event (no mid-file seek).
message Open {
  // Opaque id of this population run (logging / correlation on PS side).
  string population_id = 1;
  // ComponentBundle: 1…N tapes on one pop_ts (many fut/opt via distinct
  // component_id). P0 may send a single component; empty / duplicate ids → Error.
  repeated Component components = 2;
  // How many consecutive merged-timeline events to fold into one Tick/Advance.
  // 0 or 1 → every event is its own tick (P0 default).
  // N > 1 → coalesce N events (usually last books); speed vs accuracy.
  uint32 tape_stride = 3;
  // Strategy slots; fixed for the run (no AddSlot mid-run).
  repeated SlotConfig slots = 4;
}

// Per-strategy parameters inside Open. Immutable after Open.
message SlotConfig {
  // Slot key inside the population; orders/cancels/trades carry the same id.
  uint32 slot_id = 1;
  // Market-data lag (ns): at pop_ts = t the slot sees the book at t - md_lag.
  uint64 md_lag_ns = 2;
  // Order delay Δ (ns): decision at t → matchable at t + Δ. MUST be >= 1;
  // 0 → Error (DELTA_ZERO) and Open rejected.
  uint64 delta_ns = 3;
  // Impact recovery rate λ as decimal text (per ns). λ == 0 → impact off
  // (no eaten/recovery). λ > 0 → exponential recovery toward the file book.
  string impact_lambda = 4;
}

// Client → venue: graceful shutdown only (not a config change). Ends the run early.
message Close {}

// Client → venue: this tick is done; advance pop_ts by tape_stride events.
message Advance {}

// Venue → client: dataset tape finished (normal end of stream).
message End {}

// ---------------------------------------------------------------------------
// Tick = shared books (per component_id) + per-slot overlays/trades
// ---------------------------------------------------------------------------

message Tick {
  uint64 pop_ts_ns = 1;
  // One entry per component that has a shared-book update this tick.
  // Shared across slots — not copied into each SlotTick.
  repeated SharedBookUpdate books = 2;
  repeated SlotTick slots = 3;
}

message SharedBookUpdate {
  string component_id = 1;       // matches Open.components[].component_id
  oneof update {
    BookSnapshot keyframe = 2;   // full L2 (first tick / resync for this leg)
    BookDiff diff = 3;           // levels changed vs previous shared book
  }
}

message SlotTick {
  uint32 slot_id = 1;
  // Per-component overlays where effective ≠ shared (resting + impact).
  // Empty list / empty diff ⇒ identical to shared for that component_id.
  repeated SlotBookOverlay overlays = 2;
  repeated Trade trades = 3;     // due-match fills on this pop_ts
}

message SlotBookOverlay {
  string component_id = 1;
  // Absolute qty; 0 = remove level.
  BookDiff overlay = 2;
}

message BookSnapshot {
  repeated BookLevel bids = 1;   // best → worst, max 64
  repeated BookLevel asks = 2;
}

// Like CMF `I`: qty is absolute ("there is now this much at price"), not ±delta.
// qty == 0 removes the level.
message BookDiff {
  repeated BookLevel bids = 1;
  repeated BookLevel asks = 2;
}

message BookLevel {
  string price = 1;              // decimal text
  uint64 qty = 2;                // absolute qty at price
}

// Fill vs cancel are distinct: order_done alone cannot tell them apart.
enum ExecType {
  EXEC_UNSPECIFIED = 0;          // invalid → Error
  EXEC_FILL = 1;                 // qty filled at price; leaves = remainder
  EXEC_CANCEL = 2;               // order cancelled (explicit Cancel or IOC leftover)
}

message Trade {
  uint64 client_order_id = 1;
  ExecType exec_type = 2;
  string component_id = 3;       // which Open component this exec refers to
  string price = 4;              // fill price; empty/ignored on CANCEL
  uint64 qty = 5;                // filled qty; 0 on pure CANCEL
  uint64 leaves = 6;             // remaining after this event (0 if terminal)
}

// ---------------------------------------------------------------------------
// Orders (same client_order_id for life of order; Cancel uses that id)
// ---------------------------------------------------------------------------

message OrderBatch {
  repeated Order orders = 1;
  repeated Cancel cancels = 2;
}

enum TimeInForce {
  TIF_UNSPECIFIED = 0;  // invalid; reject
  TIF_DAY = 1;
  TIF_IOC = 2;
  TIF_FOK = 3;
}

enum Side {
  SIDE_UNSPECIFIED = 0;  // invalid; reject
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

message Order {
  uint32 slot_id = 1;
  uint64 client_order_id = 2;    // key with slot_id; must be unique while live
  string component_id = 3;       // which Open component to trade; unknown → Error
  Side side = 4;                 // SIDE_UNSPECIFIED → Error
  string price = 5;
  uint64 qty = 6;
  TimeInForce tif = 7;           // TIF_UNSPECIFIED → Error
}

message Cancel {
  uint32 slot_id = 1;
  uint64 client_order_id = 2;    // same id as the Order being cancelled
}

// Protocol / validation failure (e.g. UNSPECIFIED enum). Not a normal fill/cancel.
enum ErrorCode {
  ERROR_UNSPECIFIED = 0;
  ERROR_INVALID_TIF = 1;         // TIF_UNSPECIFIED or unknown
  ERROR_INVALID_SIDE = 2;        // SIDE_UNSPECIFIED or unknown
  ERROR_DELTA_ZERO = 3;          // Open slot with Δ = 0
  ERROR_DUPLICATE_ORDER_ID = 4;
  ERROR_NO_SUCH_ORDER = 5;
  ERROR_INVALID_OPEN = 6;        // bad Open in general
  ERROR_INTERNAL = 7;            // venue bug / unexpected failure
}

message Error {
  ErrorCode code = 1;
  string message = 2;            // human-readable detail
  uint32 slot_id = 3;            // 0 if not order-scoped
  uint64 client_order_id = 4;    // 0 if not order-scoped
}

// ---------------------------------------------------------------------------
// Stream envelopes (used by rpc.proto)
// ---------------------------------------------------------------------------

message ClientMessage {
  oneof payload {
    Open open = 1;           // must be first; fixes population for the run
    OrderBatch orders = 2;   // after Tick; may be empty
    Advance advance = 3;     // after orders; pull clock +1 step
    Close close = 4;         // graceful shutdown only (not config change)
  }
}

message ServerMessage {
  oneof payload {
    Tick tick = 1;
    End end = 2;             // tape finished (normal end)
    // May appear between any other server messages when the previous client
    // message was invalid (bad Order, bad Open, UNSPECIFIED enum, …).
    // Does not by itself end the stream; client may Close or continue if
    // the venue allows (Open failures typically imply stream teardown).
    Error error = 3;
  }
}
